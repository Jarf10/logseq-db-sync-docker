name: build-image

on:
  workflow_dispatch:
    inputs:
      logseq_ref:
        description: "logseq/logseq commit SHA, tag or branch (empty = latest master)"
        required: false
        default: ""
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve logseq ref
        id: ref
        run: |
          ref="${{ inputs.logseq_ref }}"
          sha=$(git ls-remote https://github.com/logseq/logseq.git "${ref:-HEAD}" | cut -f1 | head -n1)
          echo "sha=${sha:-$ref}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: LOGSEQ_REF=${{ steps.ref.outputs.sha }}
          tags: |
            ${{ steps.ref.outputs.image }}:latest
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
